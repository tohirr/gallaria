<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gallaria.tohirr.dev/" />
    <meta property="og:title" content="gallaria | art by africans" />
    <meta
      property="og:description"
      content="An infinite canvas of art by African artists found on the internet, with links back to every artist."
    />
    <meta property="og:image" content="https://gallaria.tohirr.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Works by African artists scattered over a dark field around the gallaria wordmark" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@_tohirr" />
    <meta name="twitter:title" content="gallaria | art by africans" />
    <meta
      name="twitter:description"
      content="An infinite canvas of art by African artists found on the internet, with links back to every artist."
    />
    <meta name="twitter:image" content="https://gallaria.tohirr.dev/twitter.png" />
    <meta name="twitter:image:alt" content="Works by African artists scattered over a dark field around the gallaria wordmark" />

    <link rel="icon" type="image/png" href="/art.png" />
    <title>gallaria</title>
  </head>
  <body>
    <canvas id="gl" aria-label="Infinite canvas of artworks. Drag to pan, scroll or pinch to zoom."></canvas>

    <div id="hud">
      <div class="corner tl">gallaria</div>
      <div class="corner tr" id="count"></div>
      <div class="corner bl" id="hint">drag · scroll · pinch · click</div>
      <div class="corner br" id="zoom"></div>
      <div id="mode" role="group" aria-label="View">
        <button type="button" data-mode="globe" aria-pressed="true" aria-label="Globe view" title="globe">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
            <circle cx="8" cy="8" r="6.25" />
            <ellipse cx="8" cy="8" rx="2.75" ry="6.25" />
            <path d="M1.75 8h12.5M3 4.5h10M3 11.5h10" />
          </svg>
        </button>
        <button type="button" data-mode="strip" aria-pressed="false" aria-label="Strip view" title="strip">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true">
            <rect x="5.5" y="3" width="5" height="10" />
            <path d="M1 4.5v7M15 4.5v7" />
          </svg>
        </button>
      </div>
      <div id="caption" hidden>
        <span id="caption-title"></span>
        <a id="caption-artist" target="_blank" rel="noopener"></a>
        <a id="caption-source" target="_blank" rel="noopener">source</a>
      </div>
      <form id="admin" hidden autocomplete="off">
        <span id="admin-target">adds a new work</span>
        <input id="admin-tweet" type="url" required placeholder="https://x.com/artist/status/…" aria-label="Tweet URL" />
        <span id="admin-photos" role="group" aria-label="Photos to add" title="which photos of the tweet to add">
          <button type="button" aria-pressed="true">1</button><button type="button" aria-pressed="false">2</button><button type="button" aria-pressed="false">3</button><button type="button" aria-pressed="false">4</button>
        </span>
        <button type="submit">link</button>
        <button type="button" id="admin-hide" hidden>hide</button>
        <span id="admin-status"></span>
      </form>
    </div>

    <div id="loader">
      <div class="sheet"><div class="fill"></div></div>
      <p class="pct">0%</p>
    </div>

    <noscript>gallaria needs JavaScript and WebGL2.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
